<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diffusion territory</title>
<style>
body { margin: 0; background: #14161a; color: #c9ced6; font: 13px/1.5 system-ui, sans-serif; }
#app { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; padding: 16px; }
#canv { width: 512px; height: 512px; max-width: 100%; background: #000; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
#panel { display: flex; flex-direction: column; gap: 8px; width: 268px; }
.row { display: flex; align-items: center; gap: 8px; }
.row > span { width: 84px; color: #8b939f; }
.row > input[type=range] { flex: 1; min-width: 0; }
output { width: 42px; text-align: right; font-variant-numeric: tabular-nums; }
.sub { color: #8b939f; font-size: 12px; margin-top: 2px; }
.cross-box { display: flex; flex-direction: column; gap: 5px; }
.pair { display: flex; align-items: center; gap: 4px; width: 58px; cursor: pointer; }
.pair input { margin: 0; }
.c0 { color: #f06a6a; font-weight: 600; }
.c1 { color: #5ad07a; font-weight: 600; }
.c2 { color: #6a9cf0; font-weight: 600; }
input:disabled, input:disabled + output { opacity: 0.35; }
.sw { flex: 1; padding: 6px 4px; border: 1px solid #2f353e; border-radius: 4px; background: #1b1f26; color: #c9ced6; font: inherit; cursor: pointer; }
.sw.on { border-color: #7d8794; background: #262c35; }
.sw[data-ch="0"].on { border-color: #f06a6a; }
.sw[data-ch="1"].on { border-color: #5ad07a; }
.sw[data-ch="2"].on { border-color: #6a9cf0; }
#probe { position: fixed; display: none; z-index: 10; pointer-events: none; background: #1b1f26; border: 1px solid #2f353e; border-radius: 4px; padding: 2px 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
#stats { font-variant-numeric: tabular-nums; }
#hint { margin: 0; color: #6d7583; }
</style>
</head>
<body>
<div id="app">
	<canvas id="canv" width="128" height="128"></canvas>
	<div id="probe"><span id="probeXY"></span> <span id="probeR" class="c0"></span> <span id="probeG" class="c1"></span> <span id="probeB" class="c2"></span></div>
	<div id="panel">
		<div class="row" id="players">
			<button class="sw" data-ch="0">R</button>
			<button class="sw" data-ch="1">G</button>
			<button class="sw" data-ch="2">B</button>
			<button class="sw" data-ch="-1">erase</button>
		</div>
		<label class="row"><span>depletion</span><input id="deplete" type="range" min="0" max="16" step="1"><output id="depleteVal"></output></label>
		<label class="row"><span>diffusion</span><input id="diffuse" type="range" min="0" max="1020" step="1"><output id="diffuseVal"></output></label>
		<label class="row"><span>brownian</span><input id="brownian" type="range" min="0" max="255" step="1"><output id="brownianVal"></output></label>
		<div class="sub">cross diffusion (either allows → both)</div>
		<div class="cross-box">
			<div class="row"><label class="pair"><input id="allow01" type="checkbox"><b class="c0">R</b>→<b class="c1">G</b></label><input id="rate01" type="range" min="0" max="255" step="1"><output id="rate01Val"></output></div>
			<div class="row"><label class="pair"><input id="allow02" type="checkbox"><b class="c0">R</b>→<b class="c2">B</b></label><input id="rate02" type="range" min="0" max="255" step="1"><output id="rate02Val"></output></div>
			<div class="row"><label class="pair"><input id="allow10" type="checkbox"><b class="c1">G</b>→<b class="c0">R</b></label><input id="rate10" type="range" min="0" max="255" step="1"><output id="rate10Val"></output></div>
			<div class="row"><label class="pair"><input id="allow12" type="checkbox"><b class="c1">G</b>→<b class="c2">B</b></label><input id="rate12" type="range" min="0" max="255" step="1"><output id="rate12Val"></output></div>
			<div class="row"><label class="pair"><input id="allow20" type="checkbox"><b class="c2">B</b>→<b class="c0">R</b></label><input id="rate20" type="range" min="0" max="255" step="1"><output id="rate20Val"></output></div>
			<div class="row"><label class="pair"><input id="allow21" type="checkbox"><b class="c2">B</b>→<b class="c1">G</b></label><input id="rate21" type="range" min="0" max="255" step="1"><output id="rate21Val"></output></div>
		</div>
		<label class="row"><span>reaction</span><input id="react" type="range" min="0" max="255" step="1"><output id="reactVal"></output></label>
		<label class="row"><span>max color</span><input id="maxColor" type="range" min="0" max="28" step="1"><output id="maxColorVal"></output></label>
		<label class="row"><span>+ / claimed</span><input id="territoryCap" type="range" min="0" max="510" step="5"><output id="territoryCapVal"></output></label>
		<label class="row"><span>steps / frame</span><input id="speed" type="range" min="1" max="8" step="1"><output id="speedVal"></output></label>
		<div class="row">
			<button class="sw" id="play">pause</button>
			<button class="sw" id="stepBtn">step</button>
			<button class="sw" id="reset">clear</button>
		</div>
		<div id="stats"></div>
		<p id="hint">drag on the map to place a source, hover a cell for its rgb. 1 2 3 pick color, 0 erase, space pause, s step, c clear. diffusion over 255 runs sub-rounds. brownian swaps random neighbours before diffusion; max color limits source feed, not stored mass.</p>
	</div>
</div>
<script src="sim.js"></script>
<script src="render.js"></script>
<script src="input.js"></script>
<script src="ui.js"></script>
<script src="main.js"></script>
</body>
</html>
